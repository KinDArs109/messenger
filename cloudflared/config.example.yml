# Cloudflare Tunnel — единственный бесплатный способ пустить сервис
# наружу при CGNAT: соединение устанавливается изнутри, поэтому белый
# IP и проброс портов не нужны.
#
# Этот файл нужен только для ИМЕНОВАННОГО туннеля — с постоянным
# адресом. Для него нужен домен, переданный в Cloudflare.
#
# Быстрая проверка без домена и без регистрации:
#     cloudflared tunnel --url http://localhost:3001
# Выдаст временный адрес вида https://что-то.trycloudflare.com,
# который меняется при каждом запуске. Для «показать другу на вечер»
# этого достаточно.
#
# ── Именованный туннель, по шагам ────────────────────────────────
#   1. cloudflared tunnel login
#   2. cloudflared tunnel create messenger
#      (запомните UUID и путь к файлу с ключом)
#   3. cloudflared tunnel route dns messenger chat.ВАШ-ДОМЕН
#   4. скопируйте этот файл в config.yml, подставьте значения
#   5. cloudflared tunnel run messenger
#
# Автозапуск службой:
#     cloudflared service install

tunnel: ПОДСТАВЬТЕ-UUID-ТУННЕЛЯ
credentials-file: C:\Users\Admin\.cloudflared\ПОДСТАВЬТЕ-UUID-ТУННЕЛЯ.json

ingress:
  - hostname: chat.ВАШ-ДОМЕН
    service: http://localhost:3001
    originRequest:
      # WebSocket через туннель проходит, но простаивающее соединение
      # рвётся по умолчанию раньше, чем Socket.io успевает пикнуть.
      noTLSVerify: false
      connectTimeout: 30s
      tcpKeepAlive: 30s

  # Обязательное правило-заглушка: всё, что не совпало, отбивается.
  - service: http_status:404
