# Тот же источник обновлений, что попадает в собранное приложение.
# Нужен только для проверок в отладке (scripts/check-release.cjs):
# в собранном .exe используется resources/app-update.yml, который
# electron-builder делает сам из поля publish в package.json.
#
# Здесь когда-то стоял GitHub — выпуски уезжали в релизы репозитория.
# Теперь адрес один, тот же, по которому открывают сам мессенджер,
# и этот файл обязан совпадать с ним: иначе проверка обновления смотрит
# в заброшенное место и находит там позапрошлую версию, а выглядит это
# как «обновление не работает».
provider: generic
url: https://45.130.42.77.sslip.io/updates
# Тот же, что electron-builder кладёт в сборку: без него проверка
# складывает скачанное не туда, куда сложило бы приложение.
updaterCacheDirName: '@messengerdesktop-updater'
