<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Мессенджер</title>
    <style>
      /* Окно запуска.
         Появляется раньше всего остального и держится, пока идёт
         проверка обновлений. Смысл не в красоте: без него человек
         секунд десять смотрит в пустой рабочий стол и не понимает,
         запустилось приложение или нет, — а если в это время качается
         обновление, то и все тридцать. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }

      body {
        width: 100vw;
        height: 100vh;
        /* Точка отсчёта для строки с версией внизу: без неё она
           считается от всего экрана, а не от окна. */
        position: relative;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        /* Всё окно — ручка перетаскивания: рамки у него нет,
           а подвинуть его иногда всё же хочется. */
        -webkit-app-region: drag;
      }

      .card {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 28px;
        background: #16171a;
        border: 1px solid #2a2d33;
        border-radius: 14px;
        color: #d3d6db;
        text-align: center;
      }

      .mark {
        position: relative;
        width: 84px;
        height: 84px;
        flex-shrink: 0;
      }

      .mark img {
        width: 100%;
        height: 100%;
        border-radius: 20px;
      }

      /* Кольцо вокруг значка — оно же и показывает, что процесс идёт.
         Отдельного «крутящегося колёсика» рядом не нужно: два
         вращающихся предмета на одном экране спорят друг с другом. */
      .mark::after {
        content: "";
        position: absolute;
        inset: -9px;
        border-radius: 26px;
        border: 2px solid transparent;
        border-top-color: #3576c0;
        border-right-color: #3576c0;
        animation: spin 0.9s linear infinite;
      }

      body.done .mark::after {
        animation: none;
        border-color: #3576c0;
        opacity: 0.35;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Надпись и подпись под ней — одной группой: иначе между ними
         встаёт общий отступ карточки в 22 точки, и подпись читается
         как отдельная мысль, а не как уточнение к строке выше. */
      .say {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      #status {
        font-size: 14px;
        font-weight: 500;
        color: #e6e7ea;
        min-height: 19px;
      }

      #detail {
        font-size: 12px;
        color: #7c828b;
        min-height: 16px;
      }

      /* Полоска появляется только на загрузке: пустая шкала под
         надписью «проверка обновлений» обещает прогресс, которого
         в этот момент нет. */
      #bar {
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: #24262b;
        overflow: hidden;
        visibility: hidden;
      }

      #bar span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: #3576c0;
        transition: width 0.2s linear;
      }

      body.loading #bar {
        visibility: visible;
      }

      footer {
        position: absolute;
        bottom: 14px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: #7c828b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><img id="icon" alt="" /></div>
      <div class="say">
        <div id="status">Запуск…</div>
        <div id="detail"></div>
      </div>
      <div id="bar"><span></span></div>
    </div>
    <footer id="version"></footer>

    <script>
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");
      const fill = document.querySelector("#bar span");

      /** Оболочка присылает одно и то же поле для всех состояний:
       *  «проверяю», «качаю 40%», «ставлю». Разбирать здесь нечего —
       *  что писать, решает тот, кто знает, что происходит. */
      function apply(state) {
        const data = state ?? {};
        if (typeof data.text === "string") status.textContent = data.text;
        detail.textContent = typeof data.detail === "string" ? data.detail : "";

        const percent = Number(data.percent);
        const loading = Number.isFinite(percent) && percent >= 0;
        document.body.classList.toggle("loading", loading);
        if (loading) fill.style.width = `${Math.min(100, Math.max(0, percent))}%`;

        document.body.classList.toggle("done", Boolean(data.done));
        if (typeof data.version === "string") {
          document.getElementById("version").textContent = data.version;
        }
        if (typeof data.icon === "string" && data.icon) {
          document.getElementById("icon").src = data.icon;
        }
      }

      window.__render = apply;
      window.splash?.onState?.(apply);
    </script>
  </body>
</html>
