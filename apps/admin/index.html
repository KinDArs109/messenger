<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Хозяйство мессенджера</title>
    <style>
      /*
       * Панель для одного человека — того, кто держит мессенджер.
       * Поэтому ни сборки, ни фреймворка: одна страница, которую видно
       * целиком и можно поправить блокнотом. Оформление намеренно
       * похоже на сам мессенджер, чтобы не переучиваться.
       */
      :root {
        --фон: #101114;
        --карточка: #16171a;
        --полоса: #1e2024;
        --текст: #dbdee1;
        --ярко: #f2f3f5;
        --тускло: #949ba4;
        --синий: #3b82f6;
        --красный: #d83c3e;
        --зелёный: #23a559;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--фон);
        color: var(--текст);
        font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        background: var(--карточка);
        border-bottom: 1px solid #000;
        position: sticky;
        top: 0;
      }
      header h1 { font-size: 15px; margin: 0; color: var(--ярко); }
      header .адрес { color: var(--тускло); font-size: 13px; }
      header .справа { margin-left: auto; display: flex; gap: 8px; align-items: center; }
      main { padding: 20px; max-width: 1100px; margin: 0 auto; }
      section { margin-bottom: 28px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--тускло); }
      table { width: 100%; border-collapse: collapse; background: var(--карточка); border-radius: 8px; overflow: hidden; }
      th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--полоса); }
      th { color: var(--тускло); font-weight: 600; font-size: 12px; text-transform: uppercase; }
      tr:last-child td { border-bottom: none; }
      button {
        font: inherit;
        border: none;
        border-radius: 6px;
        padding: 7px 12px;
        background: var(--полоса);
        color: var(--текст);
        cursor: pointer;
      }
      button:hover { background: #2a2d33; }
      button.главная { background: var(--синий); color: #fff; }
      button.опасная { background: transparent; color: var(--красный); }
      button.опасная:hover { background: rgba(216, 60, 62, .12); }
      input {
        font: inherit;
        background: var(--полоса);
        border: 1px solid var(--полоса);
        border-radius: 6px;
        padding: 9px 11px;
        color: var(--текст);
        width: 100%;
      }
      input:focus { outline: none; border-color: var(--синий); }
      .вход { max-width: 340px; margin: 12vh auto; background: var(--карточка); padding: 24px; border-radius: 10px; }
      .вход label { display: block; margin-bottom: 12px; color: var(--тускло); font-size: 12px; text-transform: uppercase; }
      .вход input { margin-top: 6px; }
      .тускло { color: var(--тускло); }
      .да { color: var(--зелёный); }
      .нет { color: var(--тускло); }
      .ошибка { background: rgba(216,60,62,.12); color: var(--красный); padding: 9px 12px; border-radius: 6px; margin-bottom: 12px; }
      .успех { background: rgba(35,165,89,.12); color: var(--зелёный); padding: 9px 12px; border-radius: 6px; margin-bottom: 12px; }
      .точка { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
      code { background: var(--полоса); padding: 2px 6px; border-radius: 4px; }
      .ряд { display: flex; gap: 8px; align-items: center; }
    </style>
  </head>
  <body>
    <div id="корень"></div>
    <script src="panel.js"></script>
  </body>
</html>
