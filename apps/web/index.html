<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: когда телефон поднимает
         экранную клавиатуру, страница ужимается вместе с ней, а не
         остаётся прежней высоты и уезжает под неё. Без этого поле
         ввода на пол-экрана закрывалось клавиатурой, которой в него
         и печатают. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="description" content="Чат для своих: серверы, каналы, личные сообщения" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Мессенджер</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
